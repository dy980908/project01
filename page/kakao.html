  <script>
    /* =========================
       기본 요소
    ========================= */
    const images = document.querySelectorAll('.profile_box img');
    const popup = document.getElementById('popup');
    const popupImg = document.getElementById('popupImg');

    const box = document.querySelector('.profile_box');
    const prevBtn = document.querySelector('.slide_btn.prev');
    const nextBtn = document.querySelector('.slide_btn.next');
    const sliderBtns = document.querySelectorAll('.slide_btn');

    let currentIndex = 0;

    /* =========================
       공통 닫기 함수 (🔥 핵심)
    ========================= */
    function closePopup() {
      popup.classList.remove('active');
      sliderBtns.forEach(btn => btn.style.display = 'block');
      updateButtons();
    }

    /* =========================
       이미지 클릭 → 팝업 열기
    ========================= */
    images.forEach((img, index) => {
      img.addEventListener('click', () => {
        popup.classList.add('active');
        popupImg.src = img.src;
        currentIndex = index;

        // 👉 슬라이드 버튼 숨기기
        sliderBtns.forEach(btn => btn.style.display = 'none');
      });
    });

    /* =========================
       팝업 닫기 (배경 클릭 유지)
    ========================= */
    popup.addEventListener('click', (e) => {
      if (e.target === popup) {
        closePopup();
      }
    });

    /* =========================
       🔥 추가 기능 1: 이미지 클릭 시 닫기
    ========================= */
    popupImg.addEventListener('click', () => {
      closePopup();
    });

    /* =========================
       🔥 추가 기능 2: ESC 키로 닫기
    ========================= */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closePopup();
      }
    });

    /* =========================
       슬라이드 이동
    ========================= */
    nextBtn.addEventListener('click', () => {
      box.scrollBy({
        left: box.clientWidth,
        behavior: 'smooth'
      });
    });

    prevBtn.addEventListener('click', () => {
      box.scrollBy({
        left: -box.clientWidth,
        behavior: 'smooth'
      });
    });

    /* =========================
       버튼 숨김/표시 로직
    ========================= */
    function updateButtons() {
      const scrollLeft = box.scrollLeft;
      const maxScroll = box.scrollWidth - box.clientWidth;

      if (scrollLeft <= 0) {
        prevBtn.style.display = 'none';
      } else {
        prevBtn.style.display = 'block';
      }

      if (scrollLeft >= maxScroll - 1) {
        nextBtn.style.display = 'none';
      } else {
        nextBtn.style.display = 'block';
      }
    }

    /* =========================
       스크롤 시 버튼 체크
    ========================= */
    box.addEventListener('scroll', updateButtons);

    /* =========================
       최초 실행
    ========================= */
    updateButtons();
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const slider = document.querySelector('.menu_banner_slider');
      const track = slider?.querySelector('.menu_banner_track');
      const prevButton = slider?.querySelector('.menu_banner_prev');
      const nextButton = slider?.querySelector('.menu_banner_next');

      if (!slider || !track || !prevButton || !nextButton) return;

      const originalSlides = Array.from(
        track.querySelectorAll('.menu_banner_item')
      );

      if (originalSlides.length < 2) return;

      /* 무한 반복을 위한 앞뒤 복제 */
      const firstClone = originalSlides[0].cloneNode(true);
      const lastClone =
        originalSlides[originalSlides.length - 1].cloneNode(true);

      firstClone.classList.add('clone');
      lastClone.classList.add('clone');

      track.appendChild(firstClone);
      track.insertBefore(lastClone, originalSlides[0]);

      const slides = track.querySelectorAll('.menu_banner_item');

      let currentIndex = 1;
      let autoSlideTimer;
      let isMoving = false;

      /* 첫 번째 실제 이미지 위치 */
      track.style.transition = 'none';
      track.style.transform = `translateX(-${currentIndex * 100}%)`;

      requestAnimationFrame(() => {
        track.style.transition = 'transform 0.6s ease';
      });

      function moveSlide() {
        isMoving = true;

        track.style.transition = 'transform 0.6s ease';
        track.style.transform = `translateX(-${currentIndex * 100}%)`;
      }

      function nextSlide() {
        if (isMoving) return;

        currentIndex += 1;
        moveSlide();
      }

      function prevSlide() {
        if (isMoving) return;

        currentIndex -= 1;
        moveSlide();
      }

      /* 끝에 도달하면 보이지 않게 실제 이미지로 이동 */
      track.addEventListener('transitionend', () => {
        if (slides[currentIndex].classList.contains('clone')) {
          track.style.transition = 'none';

          if (currentIndex === slides.length - 1) {
            currentIndex = 1;
          } else if (currentIndex === 0) {
            currentIndex = slides.length - 2;
          }

          track.style.transform = `translateX(-${currentIndex * 100}%)`;

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              track.style.transition = 'transform 0.6s ease';
            });
          });
        }

        isMoving = false;
      });

      /* 자동 슬라이드 */
      function startAutoSlide() {
        stopAutoSlide();

        autoSlideTimer = setInterval(() => {
          nextSlide();
        }, 4000);
      }

      function stopAutoSlide() {
        clearInterval(autoSlideTimer);
      }

      nextButton.addEventListener('click', () => {
        nextSlide();
        startAutoSlide();
      });

      prevButton.addEventListener('click', () => {
        prevSlide();
        startAutoSlide();
      });

      /* 마우스를 올리면 자동 이동 잠시 정지 */
      slider.addEventListener('mouseenter', stopAutoSlide);
      slider.addEventListener('mouseleave', startAutoSlide);

      /* 브라우저 탭을 벗어나면 정지 */
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          stopAutoSlide();
        } else {
          startAutoSlide();
        }
      });

      startAutoSlide();
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      const newsItems =
        document.querySelectorAll('.news_item');

      const newsPopup =
        document.getElementById('newsPopup');

      const newsPopupImg =
        document.getElementById('newsPopupImg');

      const newsPopupClose =
        document.getElementById('newsPopupClose');


      /* 게시글 클릭 → 상세 이미지 열기 */
      newsItems.forEach((item) => {

        const openButton =
          item.querySelector('.news_open_btn');

        const detailImage =
          item.dataset.popupImage;

        openButton.addEventListener('click', () => {

          if (!detailImage) return;

          newsPopupImg.src = detailImage;
          newsPopup.classList.add('active');

          /* 팝업을 열었을 때 뒤쪽 페이지 스크롤 방지 */
          document.body.style.overflow = 'hidden';

        });

      });


      /* 팝업 닫기 공통 함수 */
      function closeNewsPopup() {

        newsPopup.classList.remove('active');
        newsPopupImg.src = '';

        document.body.style.overflowX = 'hidden';
        document.body.style.overflowY = 'auto';

      }


      /* X 버튼 */
      newsPopupClose.addEventListener('click', closeNewsPopup);


      /* 검은 배경 클릭 */
      newsPopup.addEventListener('click', (event) => {

        if (event.target === newsPopup) {
          closeNewsPopup();
        }

      });


      /* ESC 키 */
      document.addEventListener('keydown', (event) => {

        if (
          event.key === 'Escape' &&
          newsPopup.classList.contains('active')
        ) {
          closeNewsPopup();
        }

      });

    });
  </script>
