  <!-- 갱신일/ 오늘 날짜 구현 -->
  <script>
    const now = new Date();
    const koreaTime = new Date(now.getTime() + (9 * 60 * 60 * 1000));

    const year = koreaTime.getUTCFullYear();
    const month = String(koreaTime.getUTCMonth() + 1).padStart(2, '0');
    const day = String(koreaTime.getUTCDate()).padStart(2, '0');

    document.getElementById('update-date').textContent = `갱신일 : ${year}.${month}.${day}`;
  </script>

  <!-- 이미지 확대 -->

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const popup = document.getElementById("imgPopup");
      const popupImg = document.getElementById("popupImg");

      // bob / pul 요소 선택
      const groups = document.querySelectorAll(".menu_group");
      groups.forEach(group => {
        group.addEventListener("click", () => {
          const img = group.querySelector(".menu_img img");

          // 큰 이미지만 팝업
          popupImg.src = img.src; popup.classList.add("show");
        });
      });
      // 팝업 이미지 클릭 → 닫기
      popup.addEventListener("click", () => { popup.classList.remove("show"); });
    });
  </script>
